  <div class="grain" aria-hidden="true"></div><div class="ambient" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div><div class="particles" id="particles" aria-hidden="true"></div>
  <div class="app"><header class="topbar"><div class="brand"><span class="brand-symbol">I</span><span>BUREAU DES OBJETS NON IDENTIFIÉS</span></div><span class="case-id">DOSSIER / 001</span></header><div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div><main id="main" aria-live="polite"></main><footer class="footer">DOCUMENT CONFIDENTIEL &nbsp;·&nbsp; USAGE STRICTEMENT PERSONNEL</footer></div>
  <div class="overlay" id="overlay" hidden><div class="loader"><div class="seal"><span>001</span></div><p class="loader-label" id="loaderLabel">Analyse en cours</p><div class="loader-line"><span></span></div><p class="loader-small" id="loaderSmall">Accès au dossier sécurisé</p></div></div>
  <script>
  (()=>{
    'use strict';
    const questions=[
      {kicker:'ÉVALUATION 01 / 04',title:'Vérification de la résistance biologique',intro:'Un objet potentiellement précieux ne peut être confié à une personne dont les capacités de survie n’ont pas été vérifiées.',question:'Vous êtes invitée à dîner. Le plat est préparé par l’une de nos mères. Il n’est pas bio. Quelle est votre réaction ?',choices:[
        ['Je goûte. J’ai déjà survécu à pire.','Courage documenté. Le bureau décline toute responsabilité en cas de complications digestives.'],
        ['Étrange… Les producteurs bio des marchés de Montauban et Fronton étaient tous fermés ?','L’absence de produits bio des marchés de Montauban et Fronton constitue effectivement une anomalie préoccupante.'],
        ['Je propose de cuisiner moi-même. Par mesure de sécurité. Et avec suffisamment d’ail et de poivre pour garantir un minimum de goût.','Instinct de conservation satisfaisant. L’usage intensif d’ail et de poivre a été signalé aux autorités compétentes.']
      ]},
      {kicker:'ÉVALUATION 02 / 04',title:'Vérification des conditions de fonctionnement',intro:'Votre survie semble possible. Reste à déterminer les conditions nécessaires à votre bon fonctionnement.',question:'Après une journée particulièrement éprouvante, quelle intervention présente les meilleures chances de rétablir votre état général ?',choices:[
        ['Un Saint-Germain Spritz parfaitement dosé.','Traitement enregistré. La posologie devra néanmoins être précisée.'],
        ['Un chocolat chaud maison, dont la recette reste confidentielle.','Antécédent chocolaté confirmé. Composition toujours protégée par le secret professionnel.'],
        ['Des pizzas maison, après avoir préparé la pâte et l’avoir laissée lever pendant 48 heures. Quant à la levure, plus il y en a, mieux c’est. Non ?','Le bureau rappelle que « beaucoup plus de levure » n’est pas une unité de mesure reconnue.'],
        ['Un latte, un flat white ou un cappuccino… C’est quoi la différence, au juste ?','Une expertise a été demandée. Les experts débattent encore des proportions.']
      ]},
      {kicker:'ÉVALUATION 03 / 04',title:'Évaluation du rapport au danger',intro:'Le dossier indique un intérêt marqué pour les activités à sensations. Certains antécédents nécessitent cependant une clarification.',question:'Parmi les situations suivantes, laquelle présente le risque le plus élevé ?',choices:[
        ['S’engager sur une piste bleue sans aucune expérience préalable du ski.','Le niveau de confiance paraît supérieur au niveau de compétence. Situation à surveiller.'],
        ['Confier Titine à quelqu’un qui mange dans sa voiture.','Risque matériel et psychologique élevé. Le bureau recommande une protection intégrale des sièges.'],
        ['Ramener son père en voiture à 14 ans.','Le bureau reconnaît une certaine précocité. Le service juridique a demandé à ne pas être associé à ce dossier.']
      ]},
      {kicker:'ÉVALUATION 04 / 04',title:'Capacité à mener une mission à son terme',intro:'Votre dossier mentionne une vitesse de marche anormalement élevée.',question:'Comment justifiez-vous cette vitesse ?',choices:[
        ['Je marche parfaitement normalement.','Déni manifeste. Aucun témoin ne confirme cette version.'],
        ['Les autres sont simplement beaucoup trop lents.','Hypothèse recevable. Les personnes concernées ont demandé un droit de réponse.'],
        ['J’ai des choses à faire, moi.','Motif accepté. Le bureau recommande malgré tout un préavis avant chaque déplacement.'],
        ['J’aime faire souffrir leurs tibiaux antérieurs.','Une consultation en médecine du sport a été proposée aux accompagnateurs.']
      ]}
    ];
    const notes=['Préférence pour les aliments bio : confirmée.','Incident chocolaté antérieur : documenté.','Véhicule personnel : Titine. État de propreté suspect.','Vitesse pédestre : supérieure aux normes admises.'];
    const state={step:0,answers:[null,null,null,null],guess:'',submitted:false};
    const main=document.getElementById('main'),progress=document.getElementById('progress'),overlay=document.getElementById('overlay');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const panel=(content,extra='')=>`<section class="scene"><div class="panel ${extra}"><i class="corner tl"></i><i class="corner br"></i>${content}</div></section>`;
    const btn=(id,label,kind='primary',disabled=false)=>`<button id="${id}" class="${kind}" ${disabled?'disabled':''}>${label} <span class="arrow" aria-hidden="true">↗</span></button>`;
    function particles(){let p=document.getElementById('particles');for(let i=0;i<17;i++){let e=document.createElement('span');e.className='particle';e.style.left=(4+Math.random()*92)+'%';e.style.bottom=(-15-Math.random()*90)+'%';e.style.animationDuration=(12+Math.random()*19)+'s';e.style.animationDelay=(-Math.random()*25)+'s';p.append(e)}}
    function render(){progress.style.width=(Math.min(state.step/10*100,100))+'%';const s=state.step;let html='';
      if(s===0)html=panel(`<div class="micro center">PROCÉDURE N° 001 · CONFIDENTIEL</div><div class="hero-symbol"><div class="ring"></div><div class="ring"></div><div class="mark">Ⅰ</div></div><h1 class="center">Un objet vous<br>est destiné.</h1><p class="lede center">Sa nature demeure <em>classifiée.</em></p><div class="rule"></div><p class="lede center">Avant de procéder à sa remise, nous devons vérifier que vous êtes apte à en devenir propriétaire.</p><div class="warning">Identification du sujet : particulièrement laborieuse. Un pseudo, presque aucune photo, pas de date de naissance en ligne… Nos enquêteurs ont cru poursuivre un fantôme des réseaux sociaux.</div>${btn('start','Commencer l’évaluation')}`);
      else if(s>=1&&s<=4){const idx=s-1,q=questions[idx],a=state.answers[idx];html=panel(`<div class="step-heading"><div class="micro eyebrow">${q.kicker}</div><div class="step-num">0${s}</div></div><h2>${esc(q.title)}</h2><p class="subtle">${esc(q.intro)}</p><div class="rule"></div><p class="question">${esc(q.question)}</p><div class="choices">${q.choices.map((item,i)=>`<button type="button" class="choice ${a===i?'selected':''}" data-choice="${i}" aria-pressed="${a===i}"><span class="letter">${'ABCD'[i]}</span><span class="choice-label">${esc(item[0])}</span>${a===i?'<span class="choice-check">✓</span>':''}</button>`).join('')}</div>${a!==null?`<div class="reaction" role="status"><div class="micro">✓ OBSERVATION DU BUREAU</div><p>${esc(q.choices[a][1])}</p></div>${btn('next',s===4?'Consulter le rapport':'Valider et poursuivre','primary')}`:''}`);
      }else if(s===5)html=panel(`<div class="micro center">SYNTHÈSE DU DOSSIER / 001</div><div class="seal"><span>✓</span></div><h2 class="center">Évaluation terminée.</h2><p class="subtle center">Les quatre vérifications réglementaires ont été effectuées.</p><div class="status-list">${['Résistance biologique','Conditions de fonctionnement','Rapport au risque','Capacité de déplacement'].map(x=>`<div class="status-row"><span>${x}</span><span class="status-check">✓ VALIDÉ</span></div>`).join('')}</div><div class="warning">Tendance à rechercher des sensations fortes : confirmée. Une décision a été prise concernant la remise de l’objet.</div>${btn('next','Prendre connaissance de la décision')}`);
      else if(s===6)html=panel(`<div class="micro center">NOTIFICATION OFFICIELLE · 001</div><div class="seal"><span>✓</span></div><div class="micro center" style="color:var(--green)">AUTORISATION ACCORDÉE</div><h1 class="center" style="margin-top:18px">Félicitations.</h1><p class="lede center">Vous remplissez les conditions nécessaires à la réception de votre cadeau.</p><div class="rule"></div><p class="subtle center">Votre aptitude a été reconnue à l’unanimité (malgré quelques réserves).</p>${btn('next','Découvrir la décision finale')}`);
      else if(s===7)html=panel(`<div class="micro center">ACCÈS AUX INFORMATIONS · DÉCISION</div><div class="seal seal-denied"><span>×</span></div><p class="subtle center">Votre demande d’accès à la nature exacte du cadeau a été examinée.</p><div class="denied center">Demande refusée.</div><div class="notice center">Tu pensais vraiment que j’allais te donner la réponse aussi facilement ?</div><p class="center" style="font-size:clamp(19px,5vw,24px);font-weight:800;color:#ffb5c1;margin:-9px 0 23px">Tié une fatiguée.</p><p class="tiny center">MOTIF OFFICIEL : DIVULGATION PRÉMATURÉE</p><div class="spaced"></div>${btn('next','Faire appel de la décision','secondary')}`);
      else if(s===8)html=panel(`<div class="micro eyebrow">PIÈCE N° 05 · EXTRAIT DÉCLASSIFIÉ</div><div class="hero-symbol" style="margin-top:16px;margin-bottom:8px;width:70px;height:70px"><div class="ring"></div><div class="mark" style="font-size:31px">?</div></div><h2 class="center">Recours accepté.<br><span style="color:var(--gold)">Partiellement.</span></h2><div class="rule"></div><div class="classified center">« Ce n’est pas une aventure. Ce n’est pas non plus un souvenir.<br><span class="classified-em">Mais les deux pourraient bien s’y retrouver.</span> »</div><div class="warning center">Information complémentaire : son utilité devrait augmenter avec le nombre d’aventures vécues.</div><p class="tiny center">NATURE DE L’OBJET : <span class="redacted">CLASSIFIÉE</span></p><div class="spaced"></div>${btn('next','J’ai peut-être une idée')}`);
      else if(s===9)html=panel(`<div class="micro eyebrow">DERNIÈRE FORMALITÉ</div><h2>Votre hypothèse.</h2><p class="lede">Vous estimez avoir identifié l’objet ? Le bureau accepte d’étudier votre hypothèse.</p>${!state.submitted?`<label for="guess" class="micro" style="display:block;margin:23px 0 10px">OBJET SUPPOSÉ</label><textarea id="guess" maxlength="300" placeholder="Je pense que c’est…">${esc(state.guess)}</textarea><div class="spaced"></div>${btn('submitGuess','Soumettre mon hypothèse','primary',!state.guess.trim())}`:`<div class="confirmed"><div class="micro" style="color:var(--green)">✓ HYPOTHÈSE ENREGISTRÉE</div><p style="margin:12px 0;line-height:1.55">${esc(state.guess)}</p><div class="rule" style="margin:15px 0"></div><p class="subtle" style="margin:0">Le bureau refuse de confirmer ou d’infirmer cette proposition. Même si elle est brillante. Même si elle est complètement à côté.</p></div><button class="secondary copy-button" id="editGuess">Modifier mon hypothèse</button><div class="spaced"></div>${btn('next','Clôturer le dossier')}`}`);
      else html=panel(`<div class="micro center">PROCÉDURE TERMINÉE</div><div class="end-icon">✓</div><h1 class="center reveal">La suite ne se trouve pas sur cet écran.</h1><p class="center rise" style="color:var(--gold);font-family:var(--serif);font-size:26px;margin-top:25px">Joyeux anniversaire… bientôt !</p><p class="center subtle" style="margin-top:-8px">Rendez-vous le 27 novembre.</p><div class="rule"></div><p class="tiny center" style="line-height:2">DOSSIER INCOMPLET<br>PIÈCE JUSTIFICATIVE MANQUANTE :<br>OBJET PHYSIQUE EN ATTENTE DE REMISE.</p><div class="spaced"></div>${btn('restart','Recommencer l’enquête','secondary')}`);
      main.innerHTML=html;wire();
    }
    function showOverlay(label,small,duration=1250,callback){document.getElementById('loaderLabel').textContent=label;document.getElementById('loaderSmall').textContent=small;overlay.hidden=false;overlay.style.display='grid';setTimeout(()=>{overlay.style.display='none';callback?.()},duration)}
    function advance(){let scene=main.querySelector('.scene');if(scene)scene.classList.add('leaving');setTimeout(()=>{state.step++;render();window.scrollTo({top:0,behavior:'instant'})},300)}
    function wire(){const s=state.step;
      if(s===0)document.getElementById('start').onclick=()=>showOverlay('Vérification de votre aptitude','Ouverture de la procédure confidentielle',1600,advance);
      if(s>=1&&s<=4){main.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.answers[s-1]=Number(b.dataset.choice);render()}));const next=document.getElementById('next');if(next)next.onclick=()=>{if(s===4)showOverlay('Analyse du dossier','Consolidation des quatre évaluations',1650,advance);else advance()}}
      if(s===5)document.getElementById('next').onclick=()=>showOverlay('Notification de décision','Vérification des autorisations',1400,advance);
      if(s===6)document.getElementById('next').onclick=()=>showOverlay('Consultation de la décision','Ouverture du volet confidentiel',1100,advance);
      if(s===7)document.getElementById('next').onclick=()=>showOverlay('Examen du recours','Recherche de documents déclassifiables',1750,advance);
      if(s===8)document.getElementById('next').onclick=advance;
      if(s===9){if(!state.submitted){const t=document.getElementById('guess'),b=document.getElementById('submitGuess');t.addEventListener('input',()=>{state.guess=t.value;b.disabled=!t.value.trim()});b.onclick=()=>{state.submitted=true;render()}}else{document.getElementById('editGuess').onclick=()=>{state.submitted=false;render()};document.getElementById('next').onclick=()=>showOverlay('Clôture de la procédure','Archivage de votre hypothèse',1450,advance)}}
      if(s===10)document.getElementById('restart').onclick=()=>{state.step=0;state.answers=[null,null,null,null];state.guess='';state.submitted=false;render()}
    }
    particles();render();
  })();
  </script>
</body>
</html>
